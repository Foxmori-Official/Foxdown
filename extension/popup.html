<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title data-i18n="extShortName">Foxdown</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; width: 296px; margin: 0; padding: 16px; color: var(--text); background: var(--card-bg); }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    h1 { font-size: 19px; margin: 0 0 12px; display: flex; align-items: center; gap: 6px; }
    h1 img { width: 28px; height: 28px; }
    .capture { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; background: var(--brand-ghost-bg); border-radius: 8px; margin-bottom: 10px; font-size: 13px; }
    .switch { position: relative; width: 40px; height: 22px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; inset: 0; background: var(--border); border-radius: 22px; transition: .2s; cursor: pointer; }
    .slider::before { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: var(--card-bg); border-radius: 50%; transition: .2s; }
    .switch input:checked + .slider { background: var(--brand); }
    .switch input:checked + .slider::before { transform: translateX(18px); }
    .stat b { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--text); }
    .stat { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--brand-ghost-bg); font-size: 13px; }
    #state { font-size: 12px; color: var(--text-dim); margin-top: 10px; min-height: 16px; }
    .row { display: flex; gap: 8px; }
    button { flex: 1; margin-top: 12px; padding: 8px; border: none; border-radius: 6px; background: var(--brand); color: var(--on-brand); font-size: 13px; cursor: pointer; }
    button.ghost { background: var(--brand-ghost-bg); color: var(--brand); }
    button:hover { background: var(--brand-hover); }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    button.ghost:hover { background: var(--brand-ghost-hover); }
    /* 本页媒体 */
    #mediaBox { margin-top: 10px; }
    .media-head { font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--ok); }
    #mediaList { max-height: 220px; overflow-y: auto; }
    .media-item { display: flex; align-items: center; gap: 6px; padding: 5px 6px; margin: 0 -6px; border-bottom: 1px solid var(--brand-ghost-bg); font-size: 12px; border-radius: 6px; }
    .media-item:hover { background: var(--brand-ghost-bg); }
    .media-item:last-child { border-bottom: none; }
    .mtag { flex: none; background: var(--ok-bg); color: var(--ok); border-radius: 4px; padding: 1px 5px; font-size: 10px; font-weight: 700; }
    .mname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .msize { flex: none; color: var(--text-dim); font-variant-numeric: tabular-nums; }
    .mdl { flex: none; margin: 0; padding: 3px 10px; font-size: 12px; border-radius: 5px; background: var(--brand); }
    .mdl:hover { background: var(--brand-hover); }
    .mdl:disabled { background: var(--text-dim); cursor: default; }
    .mpv { flex: none; margin: 0; padding: 3px 8px; font-size: 12px; border-radius: 5px; background: var(--brand-ghost-bg); color: var(--brand); }
    .mpv:hover { background: var(--brand-ghost-hover); }
    /* 预览区 */
    #previewBox { margin-top: 10px; display: none; }
    #previewBox video, #previewBox audio { width: 100%; max-height: 180px; border-radius: 6px; background: #000; display: block; }
    #previewErr { font-size: 12px; color: var(--err); margin-top: 6px; display: none; }
    #previewName { font-size: 11px; color: var(--text-dim); margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* 下载前确认模式（popup.html?mode=confirm&token=xxx，360px 独立窗口） */
    #confirmBox { display: none; }
    body.confirm-mode { width: 332px; }
    body.confirm-mode > *:not(#confirmBox) { display: none !important; }
    body.confirm-mode #confirmBox { display: block; }
    .cf-row { margin-bottom: 10px; }
    .cf-row label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 3px; }
    .cf-row input, .cf-row select {
      width: 100%; box-sizing: border-box; height: 32px; padding: 0 8px; font-size: 13px;
      border: 1px solid var(--border); border-radius: 6px; background: var(--card-bg); color: inherit;
    }
    .cf-row input:focus, .cf-row select:focus { outline: none; border-color: var(--focus); }
    .cf-row input:focus-visible, .cf-row select:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    .cf-row input[readonly] { background: var(--brand-ghost-bg); color: var(--text-dim); }
    #cfState { font-size: 12px; color: var(--err); min-height: 16px; margin-top: 4px; }
    #confirmBox .row button { box-sizing: border-box; }
    #cfStart { height: 36px; }
    #cfCancel { height: 32px; }
    #cfStart:disabled { background: var(--text-dim); cursor: default; }

  </style>
</head>
<body>
  <h1><img src="icons/icon48.png" alt="">Foxdown</h1>
  <div class="capture">
    <span id="captureLabel" data-i18n="captureLabel">接管浏览器下载</span>
    <label class="switch"><input type="checkbox" id="capture" aria-labelledby="captureLabel"><span class="slider"></span></label>
  </div>
  <div class="stat"><span data-i18n="statActive">活跃任务</span><b id="active">-</b></div>
  <div class="stat"><span data-i18n="statWaiting">等待任务</span><b id="waiting">-</b></div>
  <div class="stat"><span data-i18n="statSpeed">总下载速度</span><b id="speed">-</b></div>
  <div class="stat"><span data-i18n="statUpspeed">总上传速度</span><b id="upspeed">-</b></div>
  <div id="mediaBox" style="display:none">
    <div class="media-head" id="mediaHead"></div>
    <div id="mediaList"></div>
  </div>
  <button id="deepSearch" class="ghost" type="button" style="width:100%;display:none" data-i18n="deepSearchBtn">深度搜索</button>
  <div id="previewBox">
    <div id="previewName"></div>
    <div id="previewPlayer"></div>
    <div id="previewErr"></div>
  </div>
  <div id="state"></div>
  <div class="row">
    <button id="open" data-i18n="openPanelBtn">管理面板</button>
    <button id="options" class="ghost" data-i18n="settingsBtn">设置</button>
  </div>
  <button id="guide" class="ghost" type="button" style="width:100%" data-i18n="obOpenGuide">使用教程</button>
  <!-- 下载前确认模式表单（?mode=confirm 时才显示，其余 UI 由 CSS 隐藏） -->
  <div id="confirmBox">
    <h1><img src="icons/icon48.png" alt=""><span data-i18n="confirmTitle">确认下载</span></h1>
    <div class="cf-row">
      <label for="cfName" data-i18n="confirmFileName">文件名</label>
      <input type="text" id="cfName">
    </div>
    <div class="cf-row">
      <label for="cfReferer" data-i18n="confirmReferer">来源页面（Referer）</label>
      <input type="text" id="cfReferer" readonly>
    </div>
    <div class="cf-row">
      <label for="cfSplit" data-i18n="confirmSplit">分片数（0 = 服务器默认）</label>
      <input type="number" id="cfSplit" min="0" max="64" step="1" value="0">
    </div>
    <div class="cf-row">
      <label for="cfServer" data-i18n="confirmServer">目标服务器</label>
      <select id="cfServer"></select>
    </div>
    <div id="cfState"></div>
    <div class="row">
      <button id="cfStart" data-i18n="confirmStart">开始下载</button>
      <button id="cfCancel" class="ghost" data-i18n="confirmCancel">取消</button>
    </div>
  </div>
  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
