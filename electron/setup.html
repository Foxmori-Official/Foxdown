<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; object-src 'none'">
  <title>Foxdown</title>
  <link rel="stylesheet" href="setup.css">
  <script src="setup.js" defer></script>
</head>
<body>
  <main>
    <header>
      <img src="../web/public/logo.png" width="48" height="48" alt="">
      <strong>Foxdown</strong>
    </header>
    <h1 id="title"></h1>
    <p id="status" role="status"></p>
    <details id="error" hidden><summary id="detailsLabel"></summary><pre id="errorText"></pre></details>
    <dl>
      <div><dt id="folderLabel"></dt><dd id="folder"></dd></div>
      <div><dt id="browserLabel"></dt><dd><a id="guide" href="https://github.com/Foxmori-Official/Foxdown#browser-extension" target="_blank" rel="noopener"></a></dd></div>
    </dl>
    <button id="install" type="button" hidden></button>
  </main>
</body>
</html>
