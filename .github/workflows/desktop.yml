name: 桌面应用与浏览器扩展构建
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '发布标签，例如 v0.0.1；留空则仅构建'
        required: false
        type: string
      native_mac_arm64:
        description: '使用 GitHub 原生 ARM Mac 执行器；默认用 Intel Mac 交叉构建 ARM 安装包'
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: foxdown-build-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'latest' }}-${{ inputs.native_mac_arm64 || false }}
  cancel-in-progress: true
jobs:
  prepare:
    name: 检查版本与发布说明
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - id: version
        env:
          RELEASE_INPUT: ${{ inputs.release_tag }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: node tools/prepare-release.mjs
  desktop:
    name: 桌面应用 (${{ matrix.target }}/${{ matrix.arch }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ${{ inputs.native_mac_arm64 && 'macos-26' || 'macos-15-intel' }}
            target: mac
            arch: arm64
            node_arch: ${{ inputs.native_mac_arm64 && 'arm64' || 'x64' }}
            suffix: dmg
          - { runner: macos-15-intel, target: mac, arch: x64, node_arch: x64, suffix: dmg }
          - { runner: windows-2025, target: win, arch: x64, node_arch: x64, suffix: exe }
          - { runner: windows-11-arm, target: win, arch: arm64, node_arch: arm64, suffix: exe }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          architecture: ${{ matrix.node_arch }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm --prefix server ci
      - run: npm --prefix web ci
      - run: npm test
      - name: 检查网页构建
        shell: bash
        run: |
          set -o pipefail
          if npm run test:web-build 2>&1 | tee web-build.log; then exit 0; fi
          node --input-type=module -e "import fs from 'node:fs'; const log=fs.readFileSync('web-build.log','utf8').slice(-12000); console.log('::error title=网页构建失败::'+log.replaceAll('%','%25').replaceAll('\r','%0D').replaceAll('\n','%0A'));"
          exit 1
      - run: npm run engines
      - run: npm run test:desktop-engine
      - name: 构建安装包
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -o pipefail
          if node tools/pack-desktop.mjs --${{ matrix.target }} --${{ matrix.arch }} 2>&1 | tee installer-build.log; then exit 0; fi
          node --input-type=module -e "import fs from 'node:fs'; const log=fs.readFileSync('installer-build.log','utf8').slice(-12000); console.log('::error title=安装包构建失败::'+log.replaceAll('%','%25').replaceAll('\r','%0D').replaceAll('\n','%0A'));"
          exit 1
      - name: 验证桌面应用与浏览器扩展
        shell: bash
        env:
          FOXDOWN_TEST_PACKAGED: ${{ matrix.arch == matrix.node_arch && '1' || '0' }}
        run: |
          set -o pipefail
          if (npx --no-install playwright install chromium && npm run test:desktop-extension) 2>&1 | tee desktop-extension.log; then exit 0; fi
          node --input-type=module -e "import fs from 'node:fs'; const log=fs.readFileSync('desktop-extension.log','utf8').slice(-12000); console.log('::error title=桌面联动验证失败::'+log.replaceAll('%','%25').replaceAll('\r','%0D').replaceAll('\n','%0A'));"
          exit 1
      - name: 记录构建与验证架构
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          HOST_ARCH: ${{ matrix.node_arch }}
        run: |
          echo "### 输出架构：$TARGET_ARCH；运行验证架构：$HOST_ARCH" >> "$GITHUB_STEP_SUMMARY"
          if [ "$TARGET_ARCH" != "$HOST_ARCH" ]; then
            echo '本任务在 Intel Mac 交叉构建原生 ARM64 安装包，逐个验证 Mach-O 架构及应用签名；宿主架构执行桌面与浏览器扩展联动测试。Apple 芯片原生运行验证见项目验证记录，也可手动勾选原生 ARM 执行器。' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '已从安装包启动桌面应用，并执行浏览器扩展真实下载接管与失败回退测试。' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Foxdown-${{ matrix.target }}-${{ matrix.arch }}
          path: dist-electron/Foxdown-*.${{ matrix.suffix }}
          if-no-files-found: error
  extension:
    name: 浏览器扩展
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: 取消已被替代的旧构建
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const api = `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/actions`;
          const headers = { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json' };
          const response = await fetch(`${api}/workflows/desktop.yml/runs?branch=main&event=push&per_page=30`, { headers });
          if (!response.ok) throw new Error(`Cannot list previous builds: HTTP ${response.status}`);
          const { workflow_runs: runs } = await response.json();
          for (const run of runs) {
            if (run.id >= Number(process.env.GITHUB_RUN_ID) || !['queued', 'in_progress', 'pending'].includes(run.status)) continue;
            const cancelled = await fetch(`${api}/runs/${run.id}/cancel`, { method: 'POST', headers });
            console.log(`旧构建 ${run.id} 的取消结果：HTTP ${cancelled.status}`);
            if (run.status === 'queued' && Date.now() - Date.parse(run.created_at) > 10 * 60 * 1000 && cancelled.status === 202) {
              await new Promise(resolve => setTimeout(resolve, 10000));
              const refreshed = await fetch(`${api}/runs/${run.id}`, { headers });
              if (refreshed.ok && (await refreshed.json()).status === 'queued') {
                const forced = await fetch(`${api}/runs/${run.id}/force-cancel`, { method: 'POST', headers });
                console.log(`长期排队且未响应普通取消的旧构建 ${run.id}：HTTP ${forced.status}`);
              }
            }
          }
          NODE
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm --prefix server ci
      - run: npm --prefix web ci
      - run: npm test
      - run: npm run pack:extension
      - uses: actions/upload-artifact@v4
        with:
          name: Foxdown-extension
          path: Foxdown-extension.zip
          if-no-files-found: error
  draft-release:
    name: 生成版本标签与 Release 草稿
    if: needs.prepare.outputs.release_tag != ''
    needs: [prepare, desktop, extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: Foxdown-*
          merge-multiple: true
          path: release
      - name: 汇总产物、校验标签并创建草稿
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"
          version="${RELEASE_TAG#v}"
          test -s "release/Foxdown-$version-mac-arm64.dmg"
          test -s "release/Foxdown-$version-mac-x64.dmg"
          test -s "release/Foxdown-$version-win-x64.exe"
          test -s "release/Foxdown-$version-win-arm64.exe"
          test -s release/Foxdown-extension.zip
          (cd release && sha256sum Foxdown-* > SHA256SUMS.txt)
          (cd release && sha256sum --check SHA256SUMS.txt)
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/tags/$RELEASE_TAG"
            test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$GITHUB_SHA"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$GITHUB_SHA" >/dev/null
          fi
          if gh release view "$RELEASE_TAG" --json isDraft >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = "true"
            gh release upload "$RELEASE_TAG" release/* --clobber
            gh release edit "$RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md" --title "Foxdown $RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" release/* --verify-tag --draft --notes-file "docs/releases/$RELEASE_TAG.md" --title "Foxdown $RELEASE_TAG"
          fi
          echo "### $RELEASE_TAG 构建完成" >> "$GITHUB_STEP_SUMMARY"
          echo '已生成四个平台安装包、浏览器扩展和 SHA-256 校验清单，发布说明以中文为主、英文为次。' >> "$GITHUB_STEP_SUMMARY"
