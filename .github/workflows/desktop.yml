name: Desktop and extension builds
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: foxdown-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, target: mac, arch: arm64, suffix: dmg }
          - { runner: macos-15-intel, target: mac, arch: x64, suffix: dmg }
          - { runner: windows-2025, target: win, arch: x64, suffix: exe }
          - { runner: windows-11-arm, target: win, arch: arm64, suffix: exe }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          architecture: ${{ matrix.arch }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm --prefix server ci
      - run: npm --prefix web ci
      - run: npm test
      - name: Verify web build
        shell: bash
        run: |
          set -o pipefail
          if npm run test:web-build 2>&1 | tee web-build.log; then exit 0; fi
          node --input-type=module -e "import fs from 'node:fs'; const log=fs.readFileSync('web-build.log','utf8').slice(-12000); console.log('::error title=Web build failed::'+log.replaceAll('%','%25').replaceAll('\r','%0D').replaceAll('\n','%0A'));"
          exit 1
      - run: npm run engines
      - run: npm run test:desktop-engine
      - name: Build installer
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -o pipefail
          if node tools/pack-desktop.mjs --${{ matrix.target }} --${{ matrix.arch }} 2>&1 | tee installer-build.log; then exit 0; fi
          node --input-type=module -e "import fs from 'node:fs'; const log=fs.readFileSync('installer-build.log','utf8').slice(-12000); console.log('::error title=Installer build failed::'+log.replaceAll('%','%25').replaceAll('\r','%0D').replaceAll('\n','%0A'));"
          exit 1
      - name: Verify packaged app and browser extension
        shell: bash
        env:
          FOXDOWN_TEST_PACKAGED: '1'
        run: |
          set -o pipefail
          if (npx --no-install playwright install chromium && npm run test:desktop-extension) 2>&1 | tee desktop-extension.log; then exit 0; fi
          node --input-type=module -e "import fs from 'node:fs'; const log=fs.readFileSync('desktop-extension.log','utf8').slice(-12000); console.log('::error title=Desktop integration failed::'+log.replaceAll('%','%25').replaceAll('\r','%0D').replaceAll('\n','%0A'));"
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: Foxdown-${{ matrix.target }}-${{ matrix.arch }}
          path: dist-electron/Foxdown-*.${{ matrix.suffix }}
          if-no-files-found: error
  extension:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Cancel superseded builds
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const api = `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/actions`;
          const headers = { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json' };
          const response = await fetch(`${api}/workflows/desktop.yml/runs?branch=main&event=push&per_page=30`, { headers });
          if (!response.ok) throw new Error(`Cannot list previous builds: HTTP ${response.status}`);
          const { workflow_runs: runs } = await response.json();
          for (const run of runs) {
            if (run.id >= Number(process.env.GITHUB_RUN_ID) || !['queued', 'in_progress', 'pending'].includes(run.status)) continue;
            const cancelled = await fetch(`${api}/runs/${run.id}/cancel`, { method: 'POST', headers });
            console.log(`Superseded build ${run.id}: HTTP ${cancelled.status}`);
          }
          NODE
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm --prefix server ci
      - run: npm --prefix web ci
      - run: npm test
      - run: npm run pack:extension
      - uses: actions/upload-artifact@v4
        with:
          name: Foxdown-extension
          path: Foxdown-extension.zip
          if-no-files-found: error
  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: Foxdown-*
          merge-multiple: true
          path: release
      - name: Draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"
          (cd release && sha256sum Foxdown-* > SHA256SUMS.txt)
          if gh release view "$RELEASE_TAG" --json isDraft >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = "true"
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* --verify-tag --draft --generate-notes --title "Foxdown ${RELEASE_TAG#v}"
          fi
